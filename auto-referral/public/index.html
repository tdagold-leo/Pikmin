<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin Bloom 自動刷邀請碼</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 Pikmin Bloom 邀請碼自動化助手</h1>
            <p>自動建立 Nintendo 帳號並取得驗證碼，請在遊戲內手動登入輸入邀請碼。</p>
        </header>

        <main>
            <section class="card config-section">
                <h2>⚙️ 任務設定</h2>
                <form id="runForm">
                    <div class="form-group">
                        <label for="referralCode">邀請碼：</label>
                        <input type="text" id="referralCode" name="referralCode" value="NLSPYIBHN" required>
                    </div>
                    <div class="form-group">
                        <label for="count">執行次數：</label>
                        <input type="number" id="count" name="count" value="1" min="1" max="10" required>
                    </div>
                    <button type="submit" id="startBtn" class="primary-btn">🚀 開始執行</button>
                </form>
            </section>

            <section class="card results-section">
                <h2>📋 執行結果 (帳號與驗證碼)</h2>
                <div class="table-container">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>次數</th>
                                <th>狀態</th>
                                <th>Nintendo 帳號 (Email)</th>
                                <th>密碼</th>
                                <th>驗證碼</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <tr class="empty-row"><td colspan="5">尚未執行任務</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card logs-section">
                <h2>📺 即時執行日誌</h2>
                <div id="logsContainer" class="logs-container">
                    <!-- Logs will be appended here -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
