<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圖片座標擷取工具</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            text-align: center;
            color: var(--text-main);
        }
        p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }
        

        
        .result-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--primary); }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:active { transform: scale(0.98); }
        .btn-copy { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); }
        .btn-clear { background: #f1f5f9; color: var(--text-muted); }
        
        #status {
            font-size: 13px;
            color: var(--primary-dark);
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>🖼️ 圖片座標擷取工具</h2>
    <p>點擊或拖曳皮克敏截圖至下方，<br>將自動擷取圖片底部的經緯度座標。</p>

        <div class="mush-ocr-row" style="flex-direction:column; gap:6px; width:100%; margin-bottom:16px;">
        <input type="file" id="file-input" accept="image/*" multiple style="display:none;" onchange="handleFileInputChange(event)">
        <button type="button" onclick="document.getElementById('file-input').click()"
            style="width:100%; padding:24px 12px; border-radius:12px; background:linear-gradient(135deg,#10b981,#059669); color:white; border:none; font-size:16px; font-weight:bold; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 14px rgba(16,185,129,0.35); letter-spacing:0.5px;">
            <div style="font-size: 28px;">📸</div>
            <div>點擊選擇圖片</div>
            <div style="font-size: 12px; color: #d1fae5; font-weight:normal; margin-top:4px;">(支援連續上傳多張圖，座標會自動換行加上去)</div>
        </button>
    </div>
        <div id="drop-text">
            <div style="font-size: 24px; margin-bottom: 4px;">📥</div>
            <div>點擊選擇圖片，或將圖片拖曳至此</div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">(支援連續上傳多張圖，座標會自動換行加上去)</div>
        </div>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
    </div>

    <div class="loader" id="loader" style="margin: 10px auto;"></div>
    <div id="status"></div>

    <div class="result-area">
        <label style="font-size: 13px; font-weight: bold; color: var(--text-main);">📝 擷取結果：</label>
        <textarea id="result-text" placeholder="擷取的座標會顯示在這裡..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearText()">🗑️ 清空</button>
        <button class="btn-copy" onclick="copyText()">📋 一鍵複製</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
    const fileInput = document.getElementById('file-input');
    const resultText = document.getElementById('result-text');
    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');

    window.handleFileInputChange = function(event) {
        if (event.target.files && event.target.files.length > 0) {
            handleFiles(event.target.files);
        }
    };

    async function handleFiles(files) {
        setLoading(true);
        statusEl.innerText = \`準備處理 \${files.length} 張圖片...\`;
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            statusEl.innerText = \`處理中 (\${i + 1}/\${files.length})...\`;
            try {
                await processImage(file);
            } catch (err) {
                console.error(err);
                statusEl.innerText = \`第 \${i+1} 張處理失敗！\`;
            }
        }
        
        statusEl.innerText = \`✅ 全部處理完成！\`;
        setLoading(false);
        fileInput.value = '';
    }

    function processImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 裁切底部 25%，提高 Tesseract 辨識速度與準確度
                    const cropRatio = 0.25; 
                    const cropHeight = Math.floor(img.height * cropRatio);
                    const startY = img.height - cropHeight;
                    
                    canvas.width = img.width;
                    canvas.height = cropHeight;
                    ctx.drawImage(img, 0, startY, img.width, cropHeight, 0, 0, canvas.width, canvas.height);
                    
                    const croppedDataUrl = canvas.toDataURL('image/png');
                    
                    try {
                        const result = await Tesseract.recognize(croppedDataUrl, 'eng');
                        const text = result.data.text;
                        
                        // Regex matching numbers: (37.2921367, 140.3838253)
                        const regex = /(-?\\d{1,3}\\.\\d+)[:,\\s]+(-?\\d{1,3}\\.\\d+)/g;
                        const match = regex.exec(text);
                        
                        if (match) {
                            const lat = parseFloat(match[1]);
                            const lng = parseFloat(match[2]);
                            if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                                appendResult(\`\${lat}, \${lng}\`);
                            } else {
                                appendResult(\`[格式異常] \${match[1]}, \${match[2]}\`);
                            }
                        } else {
                            console.log("原文:", text);
                            appendResult(\`[未找到座標] \${file.name}\`);
                        }
                        resolve();
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function appendResult(text) {
        const val = resultText.value.trim();
        if (val) {
            resultText.value = val + '\\n' + text;
        } else {
            resultText.value = text;
        }
        resultText.scrollTop = resultText.scrollHeight;
    }

    function copyText() {
        if (!resultText.value) return;
        navigator.clipboard.writeText(resultText.value).then(() => {
            const orig = statusEl.innerText;
            statusEl.innerText = '✅ 複製成功！';
            setTimeout(() => { statusEl.innerText = orig; }, 2000);
        }).catch(() => {
            statusEl.innerText = '❌ 複製失敗，請手動複製';
        });
    }

    function clearText() {
        resultText.value = '';
        statusEl.innerText = '🗑️ 已清空';
        setTimeout(() => { statusEl.innerText = ''; }, 2000);
    }

    function setLoading(isLoading) {
        if (isLoading) {
            loader.style.display = 'block';
            
        } else {
            loader.style.display = 'none';
            
        }
    }
</script>
</body>
</html>
