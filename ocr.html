<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圖片座標擷取工具</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            text-align: center;
            color: var(--text-main);
        }
        p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }
        
        .result-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--primary); }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button.action-btn:active { transform: scale(0.98); }
        .btn-copy { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); }
        .btn-clear { background: #f1f5f9; color: var(--text-muted); }
        
        #status {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>🖼️ 圖片座標擷取工具</h2>
    <p>請依序點擊下方按鈕，<br>將自動擷取圖片底部的經緯度座標。</p>

    <!-- 兩段式操作區塊 -->
    <div style="display:flex; gap:8px; width:100%; margin-top:8px;">
        <input type="file" id="file-input" accept="image/*" multiple style="display:none;" onchange="updateSelectedCount()">
        <button type="button" onclick="document.getElementById('file-input').click()"
            style="flex:1; padding:16px 8px; border-radius:12px; background:#f1f5f9; color:#334155; border:2px dashed #cbd5e1; font-size:14px; font-weight:bold; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:all 0.2s;">
            <div style="font-size: 20px;">1️⃣</div>
            <div>選擇圖片</div>
        </button>
        <button type="button" onclick="startRecognition()"
            style="flex:1; padding:16px 8px; border-radius:12px; background:linear-gradient(135deg,#10b981,#059669); color:white; border:none; font-size:14px; font-weight:bold; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; box-shadow:0 4px 14px rgba(16,185,129,0.35);">
            <div style="font-size: 20px;">2️⃣</div>
            <div>開始辨識</div>
        </button>
    </div>

    <!-- 狀態顯示與 Loading -->
    <div style="min-height: 24px; text-align: center; margin-top: 4px;">
        <div class="loader" id="loader"></div>
        <div id="status" style="margin-top:4px;">尚未選擇圖片</div>
    </div>

    <div class="result-area">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <label style="font-size: 13px; font-weight: bold; color: var(--text-main);">📝 擷取結果：</label>
            <div style="display:flex; align-items:center; gap:8px;">
                <label style="font-size:12px; color:var(--text-muted); display:inline-flex; align-items:center; gap:4px; cursor:pointer;">
                    <input type="checkbox" id="dedupe-check" onchange="sortCoordinates(true)" checked> 自動去重
                </label>
                <select id="sort-select" onchange="sortCoordinates(true)" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; font-size:12px; background:white; color:#334155; outline:none; cursor:pointer;">
                    <option value="lat-asc">依緯度 (由小到大 ↑)</option>
                    <option value="lat-desc">依緯度 (由大到小 ↓)</option>
                    <option value="lng-asc">依經度 (由小到大 ↑)</option>
                    <option value="lng-desc">依經度 (由大到小 ↓)</option>
                </select>
            </div>
        </div>
        <textarea id="result-text" placeholder="擷取的座標會顯示在這裡..."></textarea>
    </div>

    <div class="btn-group">
        <button class="action-btn" onclick="sortCoordinates(true)" style="background:#e0f2fe; color:#0369a1;">🔃 排序</button>
        <button class="action-btn btn-clear" onclick="clearText()">🗑️ 清空</button>
        <button class="action-btn btn-copy" onclick="copyText()">📋 一鍵複製</button>
    </div>

    <!-- 傳送至通用暫存區快捷列 -->
    <div style="display:flex; flex-direction:column; gap:8px; padding-top:4px; border-top:1px dashed #e2e8f0;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <label style="font-size:12px; color:#0369a1; font-weight:bold; display:inline-flex; align-items:center; gap:4px; cursor:pointer;">
                <input type="checkbox" id="auto-sync-check" onchange="saveAutoSyncPref()" checked> 辨識完自動追加至通用暫存區
            </label>
        </div>
        <div class="btn-group">
            <button class="action-btn" onclick="appendToSharedScratchpad()" style="background:#f0f9ff; color:#0284c7; border:1px solid #bae6fd; padding:9px; font-size:13px;">➕ 追加至暫存區</button>
            <button class="action-btn" onclick="overwriteSharedScratchpad()" style="background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:9px; font-size:13px;">⬆️ 覆蓋至暫存區</button>
        </div>
    </div>

    <!-- 通用座標暫存區 (跨裝置即時同步) -->
    <div class="result-area" style="background:linear-gradient(160deg, #f0f9ff 0%, #f8fafc 100%); border:1.5px solid #bae6fd; border-radius:12px; padding:14px; margin-top:4px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <div style="display:flex; align-items:center; gap:6px;">
                <label style="font-size: 14px; font-weight: 800; color: #0369a1;">☁️ 通用座標暫存區</label>
                <span style="font-size:10px; background:#0284c7; color:white; padding:2px 6px; border-radius:99px; font-weight:bold;">跨裝置同步</span>
            </div>
            <span id="cloud-sync-status" style="font-size:11px; color:#059669; font-weight:bold;">⏳ 連線中...</span>
        </div>
        <div style="font-size:11px; color:#64748b; margin-bottom:2px;">所有裝置皆可即時查看與編輯此處座標（支援直接打字或貼上自動同步）</div>
        <textarea id="shared-result-text" placeholder="此處的座標會即時同步到所有裝置，可直接輸入或由上方傳入..." oninput="onSharedInput()" style="border-color:#93c5fd; background:#ffffff; height:150px;"></textarea>
        <div class="btn-group" style="margin-top:4px;">
            <button class="action-btn" onclick="sortSharedCoordinates()" style="background:#e0f2fe; color:#0369a1;">🔃 排序</button>
            <button class="action-btn btn-clear" onclick="clearSharedText()" style="background:#fee2e2; color:#b91c1c;">🗑️ 清空</button>
            <button class="action-btn btn-copy" onclick="copySharedText()" style="background:linear-gradient(135deg,#0284c7,#0369a1); box-shadow:0 2px 4px rgba(2,132,199,0.3);">📋 複製暫存區</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
    const resultText = document.getElementById('result-text');
    const sharedResultText = document.getElementById('shared-result-text');
    const cloudSyncStatus = document.getElementById('cloud-sync-status');
    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');

    // 當使用者在第一步選擇檔案後觸發
    window.updateSelectedCount = function() {
        const fileInput = document.getElementById('file-input');
        if (fileInput.files && fileInput.files.length > 0) {
            statusEl.innerText = `✅ 已選擇 ${fileInput.files.length} 張圖片，請點擊上方「2️⃣ 開始辨識」`;
            statusEl.style.color = '#059669'; // 變綠色提示
        } else {
            statusEl.innerText = `尚未選擇圖片`;
            statusEl.style.color = '#64748b';
        }
    };

    // 當使用者點擊第二步開始辨識時觸發
    window.startRecognition = function() {
        const fileInput = document.getElementById('file-input');
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("請先完成第 1 步：選擇圖片！");
            return;
        }
        handleFiles(fileInput.files);
    };

    async function handleFiles(files) {
        setLoading(true);
        statusEl.innerText = `準備處理 ${files.length} 張圖片...`;
        statusEl.style.color = '#059669';
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            statusEl.innerText = `處理中 (${i + 1}/${files.length})...`;
            try {
                await processImage(file);
            } catch (err) {
                console.error(err);
                statusEl.innerText = `第 ${i+1} 張處理失敗！`;
            }
        }
        
        sortCoordinates(false);
        const autoSyncEl = document.getElementById('auto-sync-check');
        if (autoSyncEl && autoSyncEl.checked) {
            appendToSharedScratchpad(true);
            statusEl.innerText = `✅ 全部處理完成！已自動排序並同步至通用暫存區。`;
        } else {
            statusEl.innerText = `✅ 全部處理完成！已自動按座標排序。`;
        }
        setLoading(false);
        // 清空選擇的檔案，讓使用者可以重新選擇同一張
        document.getElementById('file-input').value = '';
    }

    function processImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 裁切底部 50%，涵蓋明信片底部與皮克敏卡片下半部座標
                    const cropRatio = 0.50; 
                    const cropHeight = Math.floor(img.height * cropRatio);
                    const startY = img.height - cropHeight;
                    
                    canvas.width = img.width;
                    canvas.height = cropHeight;
                    ctx.drawImage(img, 0, startY, img.width, cropHeight, 0, 0, canvas.width, canvas.height);
                    
                    const croppedDataUrl = canvas.toDataURL('image/png');
                    
                    try {
                        const result = await Tesseract.recognize(croppedDataUrl, 'eng');
                        const text = result.data.text;
                        
                        const coords = extractCoordinates(text);
                        if (coords) {
                            appendResult(coords);
                        } else {
                            console.log("原文:", text);
                            appendResult(`[未找到座標] ${file.name}`);
                        }
                        resolve();
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function recoverMissingDot(numStr) {
        if (!numStr || numStr.includes('.')) return numStr;
        const isNegative = numStr.startsWith('-');
        const digits = isNegative ? numStr.slice(1) : numStr;
        // 皮克敏 GPS 座標通常固定為 7 位小數
        // 例如經緯度整數部分為 1~3 位數，加上 7 位小數後純數字長度為 8~10 位數
        if (digits.length >= 8 && digits.length <= 10) {
            const intLen = digits.length - 7;
            return (isNegative ? '-' : '') + digits.slice(0, intLen) + '.' + digits.slice(intLen);
        }
        return numStr;
    }

    function extractCoordinates(text) {
        if (!text) return null;

        // 1. 標準格式比對：(43.0697711, 5.7991976) 或 25.0526331, 121.4485422
        const stdRegex = /(-?\d{1,3}\.\d{3,})\s*[,，\s]\s*(-?\d{1,3}\.\d{3,})/;
        const match = stdRegex.exec(text);
        if (match) {
            const lat = parseFloat(match[1]);
            const lng = parseFloat(match[2]);
            if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                return `${lat}, ${lng}`;
            }
        }

        // 2. 智慧容錯：針對小數點被 OCR 漏掉的狀況（例如 (43.0697711, 57991976) 或 (250526331, 121.4485422)）
        const parenRegex = /[(（\[]\s*(-?\d+(?:\.\d+)?)\s*[,，\s]+\s*(-?\d+(?:\.\d+)?)\s*[)）\]]/g;
        let pMatch;
        while ((pMatch = parenRegex.exec(text)) !== null) {
            const s1 = recoverMissingDot(pMatch[1]);
            const s2 = recoverMissingDot(pMatch[2]);
            const lat = parseFloat(s1);
            const lng = parseFloat(s2);
            if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                return `${lat}, ${lng}`;
            }
        }

        return null;
    }

    function appendResult(text) {
        const val = resultText.value.trim();
        if (val) {
            resultText.value = val + '\n' + text;
        } else {
            resultText.value = text;
        }
        resultText.scrollTop = resultText.scrollHeight;
    }

    function parseCoordLine(line) {
        const trimmed = line.trim();
        if (!trimmed) return null;
        // 支援包含括號、逗號或空格的經緯度
        const match = trimmed.match(/[(（\[]?\s*(-?\d{1,3}(?:\.\d+)?)\s*[,，\s]+\s*(-?\d{1,3}(?:\.\d+)?)\s*[)）\]]?/);
        if (match) {
            const lat = parseFloat(match[1]);
            const lng = parseFloat(match[2]);
            if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                return { raw: `${match[1]}, ${match[2]}`, lat, lng, isCoord: true };
            }
        }
        return { raw: trimmed, isCoord: false };
    }

    function sortCoordinates(showFeedback = false) {
        const select = document.getElementById('sort-select');
        const mode = select ? select.value : 'lat-asc';
        const dedupe = document.getElementById('dedupe-check') ? document.getElementById('dedupe-check').checked : true;

        try {
            localStorage.setItem('pikmin_ocr_sort_mode', mode);
            localStorage.setItem('pikmin_ocr_dedupe', dedupe ? '1' : '0');
        } catch(e) {}

        const val = resultText.value.trim();
        if (!val) return;

        const lines = val.split('\n');
        let coords = [];
        const nonCoords = [];

        lines.forEach(line => {
            const parsed = parseCoordLine(line);
            if (!parsed) return;
            if (parsed.isCoord) {
                coords.push(parsed);
            } else {
                nonCoords.push(parsed.raw);
            }
        });

        if (dedupe) {
            const seen = new Set();
            coords = coords.filter(c => {
                const key = `${c.lat},${c.lng}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        coords.sort((a, b) => {
            if (mode === 'lat-asc') {
                return a.lat !== b.lat ? a.lat - b.lat : a.lng - b.lng;
            } else if (mode === 'lat-desc') {
                return a.lat !== b.lat ? b.lat - a.lat : a.lng - b.lng;
            } else if (mode === 'lng-asc') {
                return a.lng !== b.lng ? a.lng - b.lng : a.lat - b.lat;
            } else if (mode === 'lng-desc') {
                return a.lng !== b.lng ? b.lng - a.lng : a.lat - b.lat;
            }
            return 0;
        });

        const outputLines = coords.map(c => c.raw);
        if (nonCoords.length > 0) {
            outputLines.push(...nonCoords);
        }

        resultText.value = outputLines.join('\n');

        if (showFeedback && coords.length > 0) {
            const orig = statusEl.innerText;
            statusEl.innerText = `✅ 已按座標排序 (${coords.length} 筆)！`;
            statusEl.style.color = '#059669';
            setTimeout(() => { statusEl.innerText = orig; }, 2000);
        }
    }

    // 初始化讀取使用者偏好的排序方式
    try {
        const savedMode = localStorage.getItem('pikmin_ocr_sort_mode');
        if (savedMode && document.getElementById('sort-select')) {
            document.getElementById('sort-select').value = savedMode;
        }
        const savedDedupe = localStorage.getItem('pikmin_ocr_dedupe');
        if (savedDedupe !== null && document.getElementById('dedupe-check')) {
            document.getElementById('dedupe-check').checked = (savedDedupe === '1');
        }
        const savedAutoSync = localStorage.getItem('pikmin_ocr_auto_sync');
        if (savedAutoSync !== null && document.getElementById('auto-sync-check')) {
            document.getElementById('auto-sync-check').checked = (savedAutoSync === '1');
        }
    } catch(e) {}

    function saveAutoSyncPref() {
        try {
            const el = document.getElementById('auto-sync-check');
            if (el) localStorage.setItem('pikmin_ocr_auto_sync', el.checked ? '1' : '0');
        } catch(e) {}
    }

    // ======= Firebase 通用座標暫存區同步 =======
    const firebaseConfig = {
        apiKey: "AIzaSyBkmQhSKbiSTeHkbAnjSZTgYtGbmPySJbo",
        authDomain: "pikmin-tracker-3cf56.firebaseapp.com",
        databaseURL: "https://pikmin-tracker-3cf56-default-rtdb.firebaseio.com/",
        projectId: "pikmin-tracker-3cf56",
        storageBucket: "pikmin-tracker-3cf56.firebasestorage.app",
        messagingSenderId: "848190561510",
        appId: "1:848190561510:web:07ceb7fa8bc57a7004af27"
    };

    let scratchpadRef = null;
    let isLocalUpdatingCloud = false;
    let sharedInputTimer = null;

    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        scratchpadRef = database.ref('ocrScratchpad');

        scratchpadRef.on('value', (snap) => {
            const data = snap.val();
            const remoteText = (data && typeof data.text === 'string') ? data.text : '';
            if (!isLocalUpdatingCloud || document.activeElement !== sharedResultText) {
                if (sharedResultText.value !== remoteText) {
                    sharedResultText.value = remoteText;
                }
            }
            isLocalUpdatingCloud = false;
            if (data && data.updatedAt) {
                const d = new Date(data.updatedAt);
                const timeStr = [d.getHours(), d.getMinutes(), d.getSeconds()]
                    .map(n => String(n).padStart(2, '0')).join(':');
                cloudSyncStatus.innerText = `🟢 已同步 (${timeStr})`;
                cloudSyncStatus.style.color = '#059669';
            } else {
                cloudSyncStatus.innerText = '🟢 已連線 (尚無資料)';
                cloudSyncStatus.style.color = '#059669';
            }
        }, (err) => {
            console.error('Firebase sync error:', err);
            cloudSyncStatus.innerText = '⚠️ 雲端連線異常';
            cloudSyncStatus.style.color = '#dc2626';
        });
    } catch (err) {
        console.error('Firebase init error:', err);
        if (cloudSyncStatus) {
            cloudSyncStatus.innerText = '⚠️ 離線模式';
            cloudSyncStatus.style.color = '#d97706';
        }
    }

    function saveToCloud(text, statusMsg) {
        if (!scratchpadRef) return;
        isLocalUpdatingCloud = true;
        cloudSyncStatus.innerText = '⏳ 同步中...';
        cloudSyncStatus.style.color = '#0284c7';
        scratchpadRef.set({
            text: text || '',
            updatedAt: Date.now()
        }).then(() => {
            if (statusMsg) {
                const orig = statusEl.innerText;
                statusEl.innerText = statusMsg;
                statusEl.style.color = '#059669';
                setTimeout(() => { statusEl.innerText = orig; }, 2000);
            }
        }).catch((err) => {
            console.error('Save to cloud failed:', err);
            cloudSyncStatus.innerText = '❌ 同步失敗';
            cloudSyncStatus.style.color = '#dc2626';
        });
    }

    function onSharedInput() {
        cloudSyncStatus.innerText = '✏️ 編輯中...';
        cloudSyncStatus.style.color = '#d97706';
        if (sharedInputTimer) clearTimeout(sharedInputTimer);
        sharedInputTimer = setTimeout(() => {
            saveToCloud(sharedResultText.value);
        }, 450);
    }

    function formatCoordText(rawText) {
        const select = document.getElementById('sort-select');
        const mode = select ? select.value : 'lat-asc';
        const dedupe = document.getElementById('dedupe-check') ? document.getElementById('dedupe-check').checked : true;

        const lines = (rawText || '').trim().split('\n');
        let coords = [];
        const nonCoords = [];

        lines.forEach(line => {
            const parsed = parseCoordLine(line);
            if (!parsed) return;
            if (parsed.isCoord) {
                coords.push(parsed);
            } else {
                nonCoords.push(parsed.raw);
            }
        });

        if (dedupe) {
            const seen = new Set();
            coords = coords.filter(c => {
                const key = `${c.lat},${c.lng}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        coords.sort((a, b) => {
            if (mode === 'lat-asc') {
                return a.lat !== b.lat ? a.lat - b.lat : a.lng - b.lng;
            } else if (mode === 'lat-desc') {
                return a.lat !== b.lat ? b.lat - a.lat : a.lng - b.lng;
            } else if (mode === 'lng-asc') {
                return a.lng !== b.lng ? a.lng - b.lng : a.lat - b.lat;
            } else if (mode === 'lng-desc') {
                return a.lng !== b.lng ? b.lng - a.lng : a.lat - b.lat;
            }
            return 0;
        });

        const outputLines = coords.map(c => c.raw);
        if (nonCoords.length > 0) {
            outputLines.push(...nonCoords);
        }
        return { text: outputLines.join('\n'), count: coords.length };
    }

    function extractOnlyValidCoords(rawText) {
        const lines = (rawText || '').trim().split('\n');
        const valid = [];
        lines.forEach(line => {
            const parsed = parseCoordLine(line);
            if (parsed && parsed.isCoord) valid.push(parsed.raw);
        });
        return valid.join('\n');
    }

    function appendToSharedScratchpad(silent = false) {
        const newCoords = extractOnlyValidCoords(resultText.value);
        if (!newCoords) {
            if (!silent) alert('上方擷取結果中沒有有效的座標可供追加！');
            return;
        }
        const combined = sharedResultText.value.trim()
            ? (sharedResultText.value.trim() + '\n' + newCoords)
            : newCoords;
        const formatted = formatCoordText(combined);
        sharedResultText.value = formatted.text;
        saveToCloud(formatted.text, silent ? null : `☁️ 已追加並同步至通用暫存區 (共 ${formatted.count} 筆)！`);
    }

    function overwriteSharedScratchpad() {
        const newCoords = extractOnlyValidCoords(resultText.value);
        if (!newCoords) {
            alert('上方擷取結果中沒有有效的座標可供覆蓋！');
            return;
        }
        const formatted = formatCoordText(newCoords);
        sharedResultText.value = formatted.text;
        saveToCloud(formatted.text, `☁️ 已覆蓋同步至通用暫存區 (共 ${formatted.count} 筆)！`);
    }

    function sortSharedCoordinates() {
        if (!sharedResultText.value.trim()) return;
        const formatted = formatCoordText(sharedResultText.value);
        sharedResultText.value = formatted.text;
        saveToCloud(formatted.text, `✅ 通用暫存區已排序並同步 (${formatted.count} 筆)！`);
    }

    function clearSharedText() {
        if (!sharedResultText.value.trim()) return;
        sharedResultText.value = '';
        saveToCloud('', '🗑️ 已清空通用暫存區！');
    }

    function copySharedText() {
        if (!sharedResultText.value) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(sharedResultText.value).then(() => {
                showCopySuccess('✅ 暫存區複製成功！');
            }).catch(() => {
                fallbackCopyTarget(sharedResultText, '✅ 暫存區複製成功！');
            });
        } else {
            fallbackCopyTarget(sharedResultText, '✅ 暫存區複製成功！');
        }
    }

    function copyText() {
        if (!resultText.value) return;
        // 優先用現代 Clipboard API，失敗時使用舊版 execCommand (iOS 相容)
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(resultText.value).then(() => {
                showCopySuccess();
            }).catch(() => {
                fallbackCopyTarget(resultText);
            });
        } else {
            fallbackCopyTarget(resultText);
        }
    }

    function fallbackCopyTarget(targetEl, customMsg) {
        targetEl.select();
        targetEl.setSelectionRange(0, 99999); // 行動裝置需要
        try {
            document.execCommand('copy');
            showCopySuccess(customMsg);
        } catch (e) {
            statusEl.innerText = '❌ 複製失敗，請手動全選複製';
        }
    }

    function showCopySuccess(msg) {
        const orig = statusEl.innerText;
        statusEl.innerText = msg || '✅ 複製成功！';
        statusEl.style.color = '#059669';
        setTimeout(() => { statusEl.innerText = orig; }, 2000);
    }

    function clearText() {
        resultText.value = '';
        statusEl.innerText = '🗑️ 已清空';
        setTimeout(() => { statusEl.innerText = '尚未選擇圖片'; statusEl.style.color = '#64748b'; }, 2000);
    }

    function setLoading(isLoading) {
        if (isLoading) {
            loader.style.display = 'block';
        } else {
            loader.style.display = 'none';
        }
    }
</script>
